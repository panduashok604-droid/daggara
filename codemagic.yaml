workflows:
  android-workflow:
    name: Daggara Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
    scripts:
      - name: Build APK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties || true
          if [ -f "./gradlew" ]; then chmod +x ./gradlew && ./gradlew assembleDebug; else cd android && chmod +x ./gradlew && ./gradlew assembleDebug; fi
    artifacts:
      - "**/*.apk"
